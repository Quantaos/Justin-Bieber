<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trái Tim Vu Duc Quan</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    background:
      radial-gradient(circle at 18% 18%, rgba(255,110,196,.22), transparent 28%),
      radial-gradient(circle at 84% 78%, rgba(77,214,255,.2), transparent 30%),
      linear-gradient(135deg, #120722, #26103d 48%, #090512);
    background-size: 140% 140%;
    animation: backgroundDrift 14s ease-in-out infinite alternate;
    font-family: 'Segoe UI', 'Arial Unicode MS', Arial, sans-serif;
    overflow-x: hidden;
    overflow-y: auto;
    padding: 24px 16px 32px;
  }

  h1 {
    color: #fff;
    font-size: 1.4rem;
    font-weight: 300;
    letter-spacing: 4px;
    text-transform: uppercase;
    background: linear-gradient(90deg, #ff6ec4, #ffc93c, #7873f5, #ff6ec4);
    background-size: 300% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: textShine 5s linear infinite;
  }

  .music-player {
    width: min(92vw, 420px);
    padding: 18px;
    color: #fff;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 20px;
    background: rgba(31, 12, 51, .76);
    box-shadow: 0 12px 35px rgba(0,0,0,.35), 0 0 28px rgba(255,110,196,.18);
    backdrop-filter: blur(12px);
    z-index: 2;
  }

  .track-label {
    display: block;
    margin-bottom: 10px;
    color: #ffc93c;
    font-size: .75rem;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .track-title {
    min-height: 25px;
    margin-bottom: 12px;
    font-size: 1.08rem;
    font-weight: 700;
  }

  .progress-row {
    display: grid;
    grid-template-columns: 38px 1fr 38px;
    align-items: center;
    gap: 8px;
    color: rgba(255,255,255,.68);
    font-size: .72rem;
  }

  .progress {
    width: 100%;
    accent-color: #ff6ec4;
    cursor: pointer;
  }

  .player-actions {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 14px;
  }

  .player-actions button {
    min-width: 48px;
    padding: 9px 12px;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 999px;
    color: #fff;
    background: linear-gradient(135deg, #ff2d95, #a450ff);
    cursor: pointer;
    font-family: 'Segoe UI', Arial, sans-serif;
    font-size: .82rem;
    font-weight: 700;
    letter-spacing: .2px;
    transition: transform .2s, filter .2s;
  }

  .player-actions button:hover { transform: translateY(-2px); filter: brightness(1.15); }

  .player-actions button:focus-visible {
    outline: 3px solid #ffc93c;
    outline-offset: 3px;
  }

  .player-note {
    margin-top: 10px;
    color: rgba(255,255,255,.55);
    font-size: .7rem;
    text-align: center;
  }

  #youtubePlayer {
    width: 100%;
    aspect-ratio: 16 / 9;
    margin-top: 14px;
    overflow: hidden;
    border-radius: 12px;
  }

  #youtubePlayer iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }

  #audioPlayer {
    display: none;
  }

  #fireworks {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 4;
  }

  .footer {
    margin-top: 2px;
    color: rgba(255,255,255,.62);
    font-size: .78rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  @keyframes textShine {
    to { background-position: 300% center; }
  }

  @keyframes backgroundDrift {
    from { background-position: 0% 20%; }
    to { background-position: 100% 80%; }
  }

  /* ===== Trái tim ===== */
  .heart {
    position: relative;
    width: min(78vw, 280px);
    aspect-ratio: 1;
    border: 7px solid rgba(255,255,255,.75);
    border-radius: 50%;
    background: #24103b center / cover no-repeat;
    animation:
      photoPulse 2.2s ease-in-out infinite,
      hueShift 8s linear infinite;
    box-shadow:
      0 0 35px rgba(255, 45, 149, 0.75),
      0 0 100px rgba(164, 80, 255, 0.55);
    overflow: hidden;
    z-index: 1;
    transition: background-image .8s ease, transform .8s ease;
  }

  .heart::before {
    content: '';
    position: absolute;
    inset: -12px;
    border: 2px dashed rgba(255,201,60,.7);
    border-radius: 50%;
    animation: orbit 9s linear infinite;
  }

  .heart::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,.35), transparent 42%, rgba(255,45,149,.2));
  }

  /* Vệt sáng bóng loáng */
  .shine {
    position: absolute;
    top: 20px;
    left: 30px;
    width: 70px;
    height: 110px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.35);
    filter: blur(18px);
    transform: rotate(45deg);
    z-index: 1;
  }

  /* Ánh sáng lan tỏa */
  .glow-ring {
    position: absolute;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #ff2d95, #a450ff, #4dd6ff, #ff2d95);
    filter: blur(60px);
    opacity: 0.35;
    animation: spin 6s linear infinite;
    z-index: -1;
  }

  @keyframes hueShift {
    0%   { background-position: 0% 50%; filter: hue-rotate(0deg); }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; filter: hue-rotate(360deg); }
  }

  @keyframes photoPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.045); }
  }

  @keyframes orbit {
    to { transform: rotate(360deg); }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Particle bay lên */
  .particle {
    position: absolute;
    bottom: -10px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: radial-gradient(circle, #ff8fd0, transparent);
    animation: float linear infinite;
    opacity: 0;
  }

  @keyframes float {
    0%   { transform: translateY(0) scale(1); opacity: 0; }
    10%  { opacity: 0.9; }
    100% { transform: translateY(-90vh) scale(0.2); opacity: 0; }
  }
</style>
</head>
<body>

  <canvas id="fireworks" aria-hidden="true"></canvas>

  <div class="glow-ring"></div>

  <div class="heart">
    <div class="shine"></div>
  </div>

  <h1>Album Justin Bieber</h1>

  <section class="music-player" aria-label="Trình phát nhạc miễn phí">
    <span class="track-label">Free music playlist</span>
    <div class="track-title" id="trackTitle">Baby</div>
    <div class="progress-row">
      <span id="elapsed">0:00</span>
      <input class="progress" id="progress" type="range" min="0" max="100" value="0" step="0.1" aria-label="Tiến trình bài hát">
      <span id="duration">0:00</span>
    </div>
    <div class="player-actions">
      <button id="previousTrack" type="button" aria-label="Bài trước">Trước</button>
      <button id="playPause" type="button" aria-label="Phát nhạc">Phát</button>
      <button id="nextTrack" type="button" aria-label="Bài tiếp theo">Sau</button>
    </div>
    <audio id="audioPlayer" preload="metadata"></audio>
  </section>

  <footer class="footer">web by VuDucQuan</footer>

  <script>
    // Tạo hạt sáng bay lên
    for (let i = 0; i < 25; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.animationDuration = (6 + Math.random() * 8) + 's';
      p.style.animationDelay = (Math.random() * 10) + 's';
      p.style.width = p.style.height = (4 + Math.random() * 8) + 'px';
      document.body.appendChild(p);
    }

const tracks = [
    { title: 'Baby - Justin Bieber ft. Ludacris', src: 'music/Baby.mp3' },
    { title: 'Beauty And A Beat - Justin Bieber', src: 'music/Bieber-Beauty-And-A-Beat.mp3' },
    { title: 'Love Yourself - Justin Bieber', src: 'music/Love-Yourself.mp3' },
    { title: 'Sorry - Justin Bieber', src: 'music/Sorry.mp3' },
    { title: '2 Much - Justin Bieber', src: 'music/2-Much.mp3' },
    { title: 'That Should Be Me - Justin Bieber', src: 'music/That-Should-Be-Me.mp3' },
    { title: 'Intentions - Justin Bieber', src: 'music/Intentions.mp3' },
    { title: 'Lifetime - Justin Bieber', src: 'music/Lifetime.mp3' }
];
    let trackIndex = 0;
    const audio = document.getElementById('audioPlayer');

    const title = document.getElementById('trackTitle');
    const playPause = document.getElementById('playPause');
    const progress = document.getElementById('progress');
    const elapsed = document.getElementById('elapsed');
    const duration = document.getElementById('duration');
    const photo = document.querySelector('.heart');
    const photos = [
      'https://i.ytimg.com/vi/kffacxfA7G4/hqdefault.jpg',
      'https://i.ytimg.com/vi/oyEuk8j8imI/hqdefault.jpg',
      'https://i.ytimg.com/vi/fRh_vgS2dFE/hqdefault.jpg',
      'https://i.ytimg.com/vi/Ys7-6_t7OEQ/hqdefault.jpg'
    ];
    let photoIndex = 0;

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return '0:00';
      const minutes = Math.floor(seconds / 60);
      return `${minutes}:${String(Math.floor(seconds % 60)).padStart(2, '0')}`;
    }

    function updateTrackText() {
      title.textContent = tracks[trackIndex].title;
    }

    function rotatePhoto() {
      photoIndex = (photoIndex + 1) % photos.length;
      photo.style.transform = 'scale(.88) rotate(180deg)';
      setTimeout(() => {
        photo.style.backgroundImage = `url('${photos[photoIndex]}')`;
        photo.style.transform = 'scale(1) rotate(360deg)';
      }, 350);
    }

    photo.style.backgroundImage = `url('${photos[photoIndex]}')`;
    setInterval(rotatePhoto, 5000);

    function launchFireworks() {
      const canvas = document.getElementById('fireworks');
      const context = canvas.getContext('2d');
      canvas.width = innerWidth;
      canvas.height = innerHeight;
      const sparks = [];
      const colors = ['#ff6ec4', '#ffc93c', '#7873f5', '#4dd6ff', '#fff'];
      for (let burst = 0; burst < 4; burst++) {
        const centerX = innerWidth * (.18 + Math.random() * .64);
        const centerY = innerHeight * (.12 + Math.random() * .35);
        for (let i = 0; i < 55; i++) {
          const angle = Math.PI * 2 * i / 55;
          const speed = 1.5 + Math.random() * 3.5;
          sparks.push({
            x: centerX, y: centerY,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            color: colors[Math.floor(Math.random() * colors.length)]
          });
        }
      }
      function animate() {
        context.clearRect(0, 0, canvas.width, canvas.height);
        for (const spark of sparks) {
          spark.x += spark.vx;
          spark.y += spark.vy;
          spark.vy += .035;
          spark.life -= .018;
          context.globalAlpha = Math.max(spark.life, 0);
          context.fillStyle = spark.color;
          context.beginPath();
          context.arc(spark.x, spark.y, 2.2, 0, Math.PI * 2);
          context.fill();
        }
        context.globalAlpha = 1;
        if (sparks.some((spark) => spark.life > 0)) requestAnimationFrame(animate);
        else context.clearRect(0, 0, canvas.width, canvas.height);
      }
      animate();
    }

    function loadTrack(index, autoplay) {
      trackIndex = (index + tracks.length) % tracks.length;
      updateTrackText();
      audio.src = tracks[trackIndex].src;
      audio.load();
      if (autoplay) audio.play().catch(() => {});
      launchFireworks();
    }

    function updateProgress() {
      const total = audio.duration;
      const current = audio.currentTime;
      if (!Number.isFinite(total) || total <= 0) return;
      progress.value = current / total * 100;
      elapsed.textContent = formatTime(current);
      duration.textContent = formatTime(total);
    }

    playPause.addEventListener('click', () => {
      if (audio.paused) audio.play().catch(() => {});
      else audio.pause();
    });
    document.getElementById('previousTrack').addEventListener('click', () => loadTrack(trackIndex - 1, true));
    document.getElementById('nextTrack').addEventListener('click', () => loadTrack(trackIndex + 1, true));
    progress.addEventListener('input', () => {
      if (!audio.duration) return;
      audio.currentTime = audio.duration * progress.value / 100;
    });
    audio.addEventListener('loadedmetadata', updateProgress);
    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('play', () => { playPause.textContent = 'Dừng'; });
    audio.addEventListener('pause', () => { playPause.textContent = 'Phát'; });
    audio.addEventListener('error', () => {
      duration.textContent = 'Lỗi file';
      playPause.textContent = 'Phát';
    });
    audio.addEventListener('ended', () => loadTrack(trackIndex + 1, true));
    loadTrack(0, false);
    addEventListener('resize', () => {
      const canvas = document.getElementById('fireworks');
      canvas.width = innerWidth;
      canvas.height = innerHeight;
    });
  </script>

</body>
</html>
